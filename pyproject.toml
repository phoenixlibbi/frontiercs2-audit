[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fcs2audit"
version = "0.1.0"
description = "Model-free checks on the released FrontierCS 2 runs: reproduce the paper, test verdict consistency, measure pass-vs-score and near misses, and scan final patches for known-attack-text loopholes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Muhammad Labeeb Tariq" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["fcs2audit"]

[tool.pytest.ini_options]
markers = ["network: downloads the pinned FrontierCS 2 release (~26 MB, first run only)"]
testpaths = ["tests"]
pythonpath = ["."]
